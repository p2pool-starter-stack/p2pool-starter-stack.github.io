hero:
  eyebrow: "Private Monero mining · self-hosted"
  title_lead: "Own the whole"
  title_accent: "operation."
  title_tail: ""
  sub: >-
    We built this to mine Monero on a stack you <strong>own outright</strong> — no operator taking a
    cut, no custodian, and Tor-first networking by default. Choose <strong>Pithead OS</strong>
    for a dedicated machine with browser setup, or <strong>Docker Compose</strong> on your own Linux host.
  command:
    title: "you@home: ~"
    lines:
      - {
          p: true,
          text: "curl -fsSL https://github.com/p2pool-starter-stack/pithead/releases/latest/download/pithead.tar.gz | tar xz",
        }
      - { p: true, text: "cd pithead" }
      - { p: true, text: "./pithead setup" }
  appliance:
    label: "Pithead OS"
    title: "Flash. Boot. Make it yours."
    text: "A complete operating system for a machine dedicated to your mine. No Linux setup needed."
    steps:
      - "Download the image and verify its checksum."
      - "Flash a USB stick and boot your machine."
      - "Pick a role and finish setup in your browser."
    download_label: "Download image"
    checksum_label: "SHA-256 checksum"
    note: "x86-64 · UEFI · wired ethernet. Installing erases the selected disk."
  diy:
    label: "Docker Compose"
    title: "Your Linux. Your stack."
    text: "Keep the host you manage. One guided setup brings up the same stack and dashboard."
    note: "Ubuntu Server 24.04 · have your Monero payout address ready."
  cta_primary:
    {
      label: "Flash & setup guide",
      href: "https://github.com/p2pool-starter-stack/pithead/blob/main/docs/appliance.md",
    }
  cta_secondary:
    {
      label: "DIY setup guide",
      href: "https://github.com/p2pool-starter-stack/pithead/blob/main/docs/getting-started.md",
    }
  meta: "MIT-licensed · built in the open · this site makes zero third-party requests"

# "Why we built this" — the belief, stated first (Simon Sinek: start with why).
# This leads the page; the projects below are the proof, not the pitch.
beliefs:
  eyebrow: "// why we built this"
  title: "Why it exists — and where to see it."
  sub: >-
    It started with wanting a Monero mine I owned outright: private, and free of middlemen. None of
    this is a slogan — each belief is a decision you can see in the defaults, the containers, and the docs.
  items:
    - belief: "Own the whole stack."
      text: >-
        Your node, your P2Pool, your dashboard — the entire operation runs on hardware you control, from
        config you can read. Nothing rented and nothing hosted for you.
    - belief: "Tor-first, by default."
      text: >-
        Monero, Tari, and P2Pool run as Tor hidden services by default — no port forwarding, no home IP
        advertised to inbound peers. Runtime egress rides Tor by default, and a host firewall drops
        direct clearnet dials; the privacy guide lists the opt-in exceptions and the one-time install
        downloads. P2Pool payout addresses are public, so mine to a dedicated wallet.
    - belief: "Keep what you earn."
      text: >-
        P2Pool pays block rewards straight to your wallet — no pool operator, no cut, no account.
        XMRig has a separate 1% developer donation by default.
    - belief: "And it shouldn't take an expert."
      text: >-
        A browser wizard on Pithead OS, or a guided command on your Linux host, sets up the node,
        Tor, payouts, RandomX tuning, and dashboard. Start with Monero; Tari and the XvB raffle are
        optional and off for new installs. Preview disruptive changes and use Service Diagnostics
        when something looks off. The first Monero sync can take hours to days; you keep the control.

# Mono stat band under the hero.
stats:
