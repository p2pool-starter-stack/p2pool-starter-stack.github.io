  - { value: "0%", label: "P2Pool fee" }
  - { value: ":3333", label: "one endpoint for every rig" }
  - { value: "0", label: "ports forwarded" }

# "How they fit together" flow.
flow:
  eyebrow: "// how it fits together"
  title: "One coordinator. One machine or a fleet."
  sub: >-
    Pithead coordinates the nodes, privacy, payouts, and dashboard. Mine on the same machine,
    connect separate RigForge or XMRig workers, or do both. Add optional Tari merge mining and
    the XvB raffle when you want them.
  nodes:
    miners: { kicker: "RigForge / XMRig", title: "Miners", note: "local CPU or separate rigs" }
    orch: { kicker: "Pithead", title: "Coordinator", note: "nodes · privacy · payouts · :3333" }
    chains: { kicker: "Monero", title: "+ optional Tari", note: "mining over Tor" }
  side: { kicker: "XMRvsBeast", title: "Bonus rounds", note: "optional raffle · off by default" }

# The projects. Pithead is the star (featured: true).
projects:
  eyebrow: "// the projects"
  title: "Two open-source projects. One private operation."
  sub: >-
    Both projects are MIT-licensed and built in the open; the upstream software they run, such as
    P2Pool and XMRig, keeps its own licenses.
  items:
    - id: "pithead"
      featured: true
      mark: "pithead"
      accent: "orange"
      name: "Pithead"
      role: "the coordinator"
      tagline: "Private Monero mining. The whole stack, on your hardware."
      blurb: >-
        Your Monero node, zero-fee P2Pool, one endpoint for every miner, and a live dashboard,
        with Tor-first networking and optional Tari merge mining. Install Pithead OS on a
        dedicated machine, or use Docker Compose on a Linux host you manage — the same stack,
        dashboard, and configuration either way.
      image: "img/dashboard.png"
      image_alt: "The Pithead dashboard — live hashrate, P2Pool/XvB split, XvB tier, and per-worker stats"
      features:
        - {
            icon: "stack",
            title: "Your choice of setup",
            text: "Boot Pithead OS from USB and configure it in your browser: a coordinator, a coordinator that also mines, or a mining rig. Prefer your own OS? The Docker Compose setup guides you through the same stack.",
          }
        - {
            icon: "onion",
            title: "Private by default",
            text: "Tor hidden services for Monero, Tari, and P2Pool, and runtime egress routed over Tor by default — a fail-closed host firewall drops direct clearnet dials. No port forwarding. The privacy guide lists the opt-in exceptions, remote-node links, and the one-time install downloads.",
          }
        - {
            icon: "pick",
            title: "Monero + optional Tari",
            text: "Mine Monero on zero-fee P2Pool. Opt into Tari merge mining (beta, off for new installs) to reuse that work on a second chain. Tari needs a local or remote node and payout address; rewards are solo and can be months apart. Monero-only operation needs neither a Tari node nor a Tari address.",
          }
        - {
            icon: "brain",
            title: "Optional XvB raffle",
            text: "The optimizer watches XMRvsBeast and shifts hashrate to hold your tier — donating only what it needs and routing the rest to your P2Pool payouts. The raffle is beta and off for new installs; wins depend on luck.",
          }
        - {
            icon: "plug",
            title: "One endpoint for every rig",
            text: "All your miners point at a single address — no wallet in the miner, no per-rig pool config. The stack routes the hashrate.",
          }
        - {
            icon: "chart",
            title: "A dashboard worth leaving open",
            text: "Live hashrate, per-worker stats, the optional P2Pool/XvB split, and persistent trends: blocks found, pool luck, reject rates, and earnings estimates after power costs. View-only payout confirmation is an optional beta feature.",
          }
        - {
            icon: "gear",
            title: "Control from the browser",
            text: "Enable dashboard control to edit settings behind a login, preview changes, and confirm disruptive actions by typing APPLY. Payout changes also check the new address. See each rig's running configuration; optional remote rig control is beta and requires adoption and a control token.",
          }
        - {
            icon: "chart",
            title: "Diagnostics without a shell",
            text: "Service Diagnostics brings health checks and redacted service logs into the dashboard. The XMR Network card tracks sync and peers, and alerts flag node trouble or a missing Tor-only firewall. CLI users have doctor and redacted support bundles too.",
          }
        - {
            icon: "bolt",
            title: "Alerts when you need them",
            text: "Opt-in Telegram alerts the moment a node or worker drops — and when it recovers — plus a daily digest, read-only status commands, and a Healthchecks dead-man's switch for the failure the box can't report itself.",
          }
        - {
            icon: "stack",
            title: "Encrypted backups",
            text: "Save settings, secrets, Tor keys, and dashboard history in an encrypted archive from the dashboard or CLI. Restore through the appliance setup wizard on replacement hardware. Keep the backup and passphrase safe, away from the machine.",
          }
        - {
            icon: "gear",
            title: "Updates with a way back",
            text: "Pithead OS verifies a signed update on its spare system copy. If the new system does not boot healthy, it falls back to the previous copy. Data lives separately; system rollback does not undo database migrations. Compose installs have signed stack upgrades too.",
          }
        - {
            icon: "shield",
            title: "Hardened out of the box",
            text: "Non-root containers, read-only filesystems, SHA256-verified pinned binaries, digest-pinned images, and scoped Docker-socket proxies. Stack bundles and images are cosign-signed; appliance updates are signed and verified before installation.",
          }
      links:
        - {
            label: "GitHub",
            href: "https://github.com/p2pool-starter-stack/pithead",
            primary: true,
          }
        - { label: "Docs", href: "https://github.com/p2pool-starter-stack/pithead/tree/main/docs" }

    - id: "rigforge"
      featured: false
      mark: "rigforge"
      accent: "ember"
      name: "RigForge"
      role: "the miners"
      tagline: "Provision a hardware-tuned XMRig miner in one command."
      blurb: >-
        Turn an Ubuntu/Debian machine into a tuned mining worker (macOS support is deprecated
        and untested). RigForge compiles
        stock, commit-pinned XMRig from source, applies CPU- and kernel-level tuning aimed at
        RandomX hashrate, and runs it as a managed service — then points it at your stack, or any
        RandomX pool.
      features:
        - {
            icon: "bolt",
            title: "One command, bare metal to mining",
            text: "Installs the toolchain, compiles commit-pinned upstream XMRig, and starts it as a managed service — on Ubuntu/Debian.",
          }
        - {
            icon: "chart",
            title: "Measurably faster, and cooler",
            text: "+3.5% hashrate and +7.6% efficiency on a Ryzen 7800X3D, measured live against stock XMRig — and +6.6% on a 48-core EPYC.",
          }
        - {
            icon: "cpu",
            title: "Hardware-aware tuning",
            text: "Detects your CPU (EPYC, Ryzen X3D, …), applies a matching profile, then live-A/Bs the hardware prefetcher to keep the fastest.",
          }
        - {
            icon: "gear",
            title: "Kernel-tuned (Linux)",
            text: "HugePages (1 GB / 2 MB), MSR access, NUMA binding, and a performance governor — configured for you.",
          }
        - {
            icon: "plug",
            title: "Plug-and-play",
            text: "Points at Pithead with no wallet in the miner, or at any RandomX Stratum pool with your wallet as the pool user. Workers pointed at Pithead don't need Tor.",
          }
        - {
            icon: "shield",
            title: "Stock XMRig, verified",
            text: "Compiles upstream XMRig pinned to a verified commit — no custom binary, no curl | bash. Keeps XMRig's standard 1% dev fee (it funds the upstream XMRig project, not us); one line turns it off. Idempotent re-runs.",
          }
      links:
        - {
            label: "GitHub",
            href: "https://github.com/p2pool-starter-stack/rigforge",
            primary: true,
          }
        - {
            label: "Benchmarks",
            href: "https://github.com/p2pool-starter-stack/rigforge/blob/main/docs/benchmarks.md",
          }

# Shipped capabilities, grouped by the foundation and the appliance experience.
# Keep the existing timeline layout; future work belongs in the project's issue tracker.
roadmap:
  eyebrow: "// the roadmap"
  title: "Built for the whole life of a mine."
  sub: >-
    From private networking and fleet management to installing, updating, and recovering your
    machine — these capabilities have shipped. Follow the repositories for current work, release
    notes, and known issues.
  waves_label: "the foundation · shipped"
  waves:
    - {
        n: "1.1",
        name: "Privacy, by default",
        status: "Shipped",
        text: "All runtime egress moved behind Tor with a fail-closed host firewall, every container dropped to non-root, and a Stack Topology panel maps every hop — Tor or clearnet — at a glance.",
      }
    - {
        n: "1.2",
        name: "Operator alerts",
        status: "Shipped",
        text: "An opt-in Telegram bot pings the moment a node or worker drops — and when it recovers — plus a Healthchecks dead-man's switch for the one failure a monitor on the box can never report: the box itself going dark.",
      }
    - {
        n: "1.3+",
        name: "Trends & insight",
        status: "Shipped",
        text: "Persistent telemetry, pool cadence and luck, and earnings estimates after power costs. Optional view-only payout confirmation is beta; Tari confirmation has a known reporting limitation documented in the release notes.",
      }
    - {
        n: "1.4+",
        name: "Control & fleet",
        status: "Shipped",
        text: "Configuration previews and confirmations, signed upgrades, per-rig inspection, stratum TLS with per-rig pinning, and warm failover to a backup stack. Remote rig control is an optional beta feature.",
      }
    - {
        n: "1.12+",
        name: "Deploy anywhere",
        status: "Shipped",
        text: "Co-host behind an existing reverse proxy, let one stack's synced nodes serve others, and point the stack at a remote Monero or Tari node instead of running your own.",
      }
  ship:
    title: "A stack you can verify."
    text: "Pinned components, signed releases, and a public changelog. Updates are checked against the release key before installation, and each release documents its components and known issues."
  beyond_label: "the appliance experience · shipped"
  releases:
    - {
        n: "01",
        status: "Shipped",
        name: "Flash a drive, boot a mine",
        text: "Write Pithead OS to USB, boot a dedicated machine, and finish setup in a browser. Pick a coordinator, add mining on its own CPU, or make it a rig for an existing coordinator. Installing to an internal disk erases that disk; the wizard asks you to confirm.",
      }
    - {
        n: "02",
        status: "Shipped",
        name: "Updates that fall back on failure",
        text: "Update from the dashboard or CLI. The signed image is installed on the spare system copy and checked at boot. Chain services start after that copy commits, so a one-way database migration cannot begin on a system still awaiting its boot decision. Rollback covers the system, not data migrations or a failing disk.",
      }
    - {
        n: "03",
        status: "Shipped",
        name: "Back up, restore, start again",
        text: "Export an encrypted backup and restore it from the setup wizard. Config reset keeps synced chains, wallets, and Tor keys while you re-enter settings; factory reset erases the data area. A damaged data partition is repaired before reinitialization is considered.",
      }
    - {
        n: "04",
        status: "Shipped",
        name: "Headless setup and recovery",
        text: "Put a setup token or configuration file on the USB stick to prepare a machine without a monitor. A configuration stick can also recover settings when you cannot sign in. Internal-disk installation still requires you to choose and confirm the disk to erase.",
      }
  ship_beyond:
    tag: "LIVE"
    name: "Tuned for a dedicated machine."
    text: "Pithead OS sizes HugePages to installed RAM, selects the performance CPU governor, and uses a hardware watchdog where available. The Tor-only egress firewall fails closed for IPv6 too. Prefer managing the host yourself? Docker Compose remains a supported install path."
  donate:
    eyebrow: "// fuel the roadmap"
    title: "Built in the open. Funded by the people who run it."
    text: "Every wave above shipped by hand, issue by issue, out in the open. If this stack saved you time, fuel the next wave."
    note: "Monero, naturally — straight to the people who build it."

# "How we build" — the ethos.
ethos:
  eyebrow: "// how we build"
  title: "The XMR ethos, in the architecture."
  items:
    - {
        title: "Privacy is the default, not a setting",
        text: "Inbound rides Tor hidden services — no port forwarding, your home IP not advertised to inbound peers — RPC stays localhost-bound, and all runtime egress routes over Tor by default. The opt-in clearnet exceptions are documented in the privacy guide.",
      }
    - {
        title: "Least privilege, everywhere",
        text: "Capability-scoped containers, a read-only Docker-socket proxy kept separate from a start/stop-only one, owner-only secrets.",
      }
    - {
        title: "Verifiable and pinned",
        text: "Third-party binaries are SHA256-checked and version-pinned. No curl | bash trust.",
      }
    - {
        title: "The why lives in the code",
        text: "Non-obvious decisions are documented inline with their reasoning and the issue that drove them.",
      }
    - {
        title: "Small, reversible, issue-driven",
        text: "Config changes are previewed and warn before anything disruptive; failures degrade gracefully.",
      }
    - {
        title: "Respect the operator's time",
        text: "Sensible auto-tuning, guided setup in a browser or terminal, and docs treated as a first-class deliverable.",
      }

# FAQ — answers the real questions people (and AI assistants) ask about mining
# Monero at home. Plain-text answers (no HTML) so they feed the FAQPage JSON-LD
# verbatim; an optional link/link_label adds a CTA to the visible card only.
faq:
  eyebrow: "// questions, answered"
  title: "How to mine Monero privately, answered."
  sub: >-
    Everything people ask before they start — and what to tell anyone who asks you.
  items:
    - q: "How do I mine Monero privately at home?"
      a: >-
        Install Pithead OS on a dedicated machine, or use the Docker Compose setup on your Linux host.
        Both run your Monero node, P2Pool, and a single mining endpoint with Tor-first networking.
        Your home IP is not advertised to inbound peers and you don't forward a port. After Monero
        syncs, use the appliance's built-in miner or connect XMRig or RigForge workers. Payouts go
        straight to your wallet, with no account or custodian. Use a dedicated mining wallet:
        P2Pool payout addresses are public.
      link: "https://github.com/p2pool-starter-stack/pithead"
      link_label: "Start with Pithead"

    - q: "Do I have to forward ports or expose my home IP to mine Monero?"
      a: >-
        No. Pithead runs Monero, Tari, and P2Pool as Tor hidden services, so inbound peers reach you over
        an onion address and your router stays shut. RPC is bound to localhost, and all runtime egress
        routes over Tor by default behind a fail-closed firewall. The privacy guide maps the exceptions:
        opt-ins like a faster clearnet initial sync, a remote node you choose (dialled directly), and
        the one-time install downloads, which reveal your IP to the download host.

    - q: "What is P2Pool, and why mine to it instead of a centralized pool?"
      a: >-
        P2Pool is a decentralized, peer-to-peer Monero mining pool. There's no operator, no account, and
        no pool fee — the network pays block rewards straight to your own wallet. The P2Pool Starter Stack
        runs your own P2Pool node, so you get decentralized, zero-fee payouts without the fiddly setup.

    - q: "Is solo Monero mining worth it, or should I use a pool?"
      a: >-
        Solo mining only pays when you personally find a block, which can take a very long time on home
        hardware. P2Pool pays you whenever the pool finds a block while you hold shares in its PPLNS
        window, with no operator and no fee. Payouts still swing with mining luck, so quiet stretches
        are normal; the default mini sidechain lets a typical home rig find shares far more often than
        main, and nano suits a single low-power rig. Pithead runs P2Pool for you and can also enter the
        XMRvsBeast raffle, which picks winners at random.

    - q: "What hardware do I need to mine Monero?"
      a: >-
        For a coordinator with both chains local, allow 16 GB+ RAM and a 600 GB+ SSD, with more room
        for growth. Pithead OS needs a dedicated x86-64 UEFI machine, wired ethernet, and a 16 GB+
        USB stick; installation erases the selected disk. DIY targets Ubuntu Server 24.04.
        Remote nodes or Monero-only operation reduce storage needs. A worker-only rig holds no
        chains: size it for CPU mining, not the coordinator's storage budget.
      link: "https://github.com/p2pool-starter-stack/pithead/blob/main/docs/hardware.md"
      link_label: "Compare hardware requirements"

    - q: "Should I choose Pithead OS or Docker Compose?"
      a: >-
        Choose Pithead OS for a machine dedicated to mining: boot from USB, install, and use the
        browser wizard without setting up Linux yourself. It can coordinate your mine, also mine on
        its own CPU, or act as a worker for another Pithead. Choose Docker Compose if you already
        manage a Linux host and want to keep that OS. Both coordinator installs share the same stack,
        dashboard, and configuration; Compose users maintain their own host OS.
      link: "https://github.com/p2pool-starter-stack/pithead/blob/main/docs/appliance.md"
      link_label: "Read the appliance setup guide"

    - q: "What is Monero + Tari merge mining?"
      a: >-
        Tari merge mining is beta and off for new installs. Enable it to let one unit of proof-of-work
        secure two chains at once. Through P2Pool, your
        P2Pool hashrate also merge-mines Tari on the same work, at no cost to the Monero side. It does
        need a Tari base node — run on this host, with its own RAM and disk, or one you run on another
        machine — and a Tari payout address. Tari is merge-mined solo, so its reward lands all at once
        when your hashrate finds a Tari block, and that can be months apart.

    - q: "Is it free? Are there any pool fees or a dev fee?"
      a: >-
        Yes — Pithead and RigForge are free and MIT-licensed (the upstream software they run, such as
        P2Pool and XMRig, keeps its own licenses), and P2Pool charges no pool fee. RigForge keeps XMRig's
        standard 1% dev fee — that funds the upstream XMRig project, not us — and makes it one line to turn
        off before setup (an already-built worker needs a rebuild to lower it). Electricity and hardware are your own running costs; the dashboard can estimate profit after
        power. The only optional extra is a Monero donation address if a stack saves you time.

    - q: "Can I point my existing XMRig miners at it?"
      a: >-
        Yes. Any XMRig or RandomX rig connects to the stack's single endpoint at host:3333 — no wallet in
        the miner, no per-rig pool config. Plain XMRig rigs mine and show up on the dashboard; retuning a
        rig from the dashboard is beta and needs RigForge control, a token, and adoption. For more hashrate,
        RigForge provisions a kernel-tuned XMRig worker in one command; its published benchmark of a
        single Ryzen 7800X3D, mining live, measured +3.5% hashrate and +7.6% efficiency versus stock.
        Results vary by hardware.
      link: "https://github.com/p2pool-starter-stack/rigforge"
      link_label: "Provision with RigForge"

    - q: "What is XMRvsBeast (XvB), and how does the optimizer use it?"
      a: >-
        The XvB raffle is beta and off for new installs. XMRvsBeast runs bonus rounds for miners who
        lend a little hashrate. Pithead's algorithmic
        optimizer watches XvB and shifts just enough hashrate to hold your tier — donating the minimum —
        and routes the rest to your own P2Pool payouts. The raffle picks winners at random, so donating
        above a tier's threshold earns nothing extra.

    - q: "How do updates, backups, and recovery work?"
      a: >-
        Pithead OS installs signed updates onto a spare system copy and falls back if the new system
        fails its boot checks. This protects the system image, not one-way database migrations.
        Save encrypted backups and their passphrases off the machine, then restore from the setup
        wizard if hardware needs replacing. Config reset keeps synced chains and identity data;
        factory reset erases the data area. Check release notes for known issues before updating.
      link: "https://github.com/p2pool-starter-stack/pithead/releases/latest"
      link_label: "Release notes and known issues"

    - q: "Can I upgrade an existing 1.x install?"
      a: >-
        Upgrades from 1.x are best-effort and may need a fresh setup. Back up with chains first and
        read the migration guide: Tari's database migration is one-way, needs extra disk space,
        and must finish without a restart. Upgrades retain your choices but migrate legacy settings
        and remove retired SSH and Telegram control options. The Monero-only and raffle-off defaults
        apply to new installs.
      link: "https://github.com/p2pool-starter-stack/pithead/releases/tag/v2.0.0#upgrading-from-120x"
      link_label: "Read the 1.x upgrade instructions"

